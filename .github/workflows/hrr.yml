# The HRR algebra's properties, run somewhere other than where they were written.
#
# `hrr.py` states its claims in prose: byte-identical across three languages,
# quantising exact for an atom, order-independent once on the uint16 grid. Prose is
# not checkable and the claims are over all inputs, so they are properties rather
# than examples, and Hypothesis is what turns them into a gate.
#
# The negative controls are not optional here. Each property is paired with a
# control that breaks one thing and asserts the property goes red -- the same rule
# `mix check --self-test` enforces on the Elixir side, for the same reason: a check
# that cannot fail is evidence of nothing. Two of the first controls written did not
# break their properties, which is exactly the failure this catches.
#
# `memory.py verify` is deliberately not here, and this is the same split checks.yml
# already makes: what a bare runner can answer for itself runs here, and what needs
# something the runner does not have stays where that thing is. verify shells out to
# usdcat, and OpenUSD reaches this workspace through the flow adapters rather than
# through a pip wheel -- provisioning a second, unrelated copy of USD to satisfy a
# runner would make CI a different machine in exactly the way the pinning above exists
# to prevent. Run it on the desk, where the adapters are.
#
# This job never calls the network beyond installing the two pinned dependencies.

name: hrr

on:
  push:
  pull_request:

jobs:
  properties:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/hrr-memory

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r tests/requirements.txt

      - name: properties, and the controls that prove they can fail
        run: python -m pytest tests/test_hrr.py -q
